<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Video Vault</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <div class="max-w-md mx-auto p-4">
        <header class="flex justify-between items-center mb-4 mt-2">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">🎬 Family Video Vault</h1>
                <p id="counter" class="text-xs text-slate-400">Loading catalog...</p>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-2 rounded-xl shadow-lg transition">+ Add Link</button>
        </header>

        <div class="mb-4">
            <input type="text" id="searchBox" placeholder="Search titles or tags (e.g., #mom, birthday)..." oninput="filterVideos()" class="w-full bg-slate-800 border border-slate-700 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 text-slate-200 placeholder-slate-400">
        </div>

        <div id="tagFilters" class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none"></div>

        <div id="videoList" class="space-y-4"></div>
    </div>

    <!-- Add Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
            <h3 class="font-bold text-lg">Add New Video Link</h3>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Video Title</label>
                <input type="text" id="newTitle" placeholder="e.g. Mom's Birthday" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Telegram Message Link</label>
                <input type="text" id="newUrl" placeholder="https://t.me/c/..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Hashtags</label>
                <input type="text" id="newTags" placeholder="#mother #mom #birthday" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-medium transition">Cancel</button>
                <button onclick="saveVideo()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-sm font-medium transition">Save Video</button>
            </div>
        </div>
    </div>

    <script>
        const defaultVideos = [
            { id: 1, title: "Mom's 50th Birthday Celebration", url: "https://t.me/", date: "2024-11-12", tags: ["#mother", "#mom", "#birthday", "#family"] },
            { id: 2, title: "Sister Graduation", url: "https://t.me/", date: "2024-06-20", tags: ["#sister", "#graduation", "#family"] },
            { id: 3, title: "Daughter First Steps", url: "https://t.me/", date: "2023-09-14", tags: ["#daughter", "#family"] }
        ];

        let videos = JSON.parse(localStorage.getItem('family_videos')) || defaultVideos;
        let activeTag = 'All';

        function render() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const list = document.getElementById('videoList');
            
            const filtered = videos.filter(v => {
                const matchesQuery = v.title.toLowerCase().includes(query) || v.tags.some(t => t.toLowerCase().includes(query));
                const matchesTag = activeTag === 'All' || v.tags.includes(activeTag);
                return matchesQuery && matchesTag;
            });

            document.getElementById('counter').innerText = `${videos.length} videos cataloged`;

            // Tags bar
            const allTags = ['All', ...new Set(videos.flatMap(v => v.tags))];
            document.getElementById('tagFilters').innerHTML = allTags.map(tag => `
                <button onclick="activeTag='${tag}'; render();" class="whitespace-nowrap px-3 py-1.5 rounded-xl text-xs font-medium transition ${activeTag === tag ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                    ${tag}
                </button>
            `).join('');

            // Video Cards
            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">No videos found. Click "+ Add Link" above!</div>`;
                return;
            }

            list.innerHTML = filtered.map(v => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 relative shadow-lg group">
                    <button onclick="deleteVideo(${v.id})" class="absolute top-3 right-3 text-slate-500 hover:text-red-400 bg-slate-800/80 hover:bg-red-950/50 w-7 h-7 rounded-full flex items-center justify-center text-xs transition" title="Delete video">✕</button>
                    <div class="text-[10px] text-slate-400 font-mono mb-1">${v.date}</div>
                    <h3 class="font-semibold text-slate-100 text-base mb-2 pr-6">${v.title}</h3>
                    <div class="flex flex-wrap gap-1.5 mb-3">
                        ${v.tags.map(t => `<span class="bg-slate-800 text-blue-400 text-[10px] px-2 py-0.5 rounded-md font-medium">${t}</span>`).join('')}
                    </div>
                    <a href="${v.url}" target="_blank" onclick="Telegram.WebApp.openTelegramLink('${v.url}')" class="block w-full bg-slate-800 hover:bg-blue-600 hover:text-white text-slate-200 text-center py-2.5 rounded-xl text-xs font-semibold transition">
                        ▶ Play Video in Telegram
                    </a>
                </div>
            `).join('');
        }

        function openModal() { document.getElementById('addModal').classList.remove('hidden'); document.getElementById('addModal').classList.add('flex'); }
        function closeModal() { document.getElementById('addModal').classList.add('hidden'); document.getElementById('addModal').classList.remove('flex'); }

        function saveVideo() {
            const title = document.getElementById('newTitle').value.trim();
            const url = document.getElementById('newUrl').value.trim();
            const tagsInput = document.getElementById('newTags').value.trim();

            if (!title || !url) { alert('Please fill in both title and link'); return; }

            const tags = tagsInput ? tagsInput.split(' ').map(t => t.startsWith('#') ? t : '#' + t) : ['#family'];
            const newEntry = { id: Date.now(), title, url, date: new Date().toISOString().split('T')[0], tags };

            videos.unshift(newEntry);
            localStorage.setItem('family_videos', JSON.stringify(videos));

            document.getElementById('newTitle').value = '';
            document.getElementById('newUrl').value = '';
            document.getElementById('newTags').value = '';
            closeModal();
            render();
        }

        function deleteVideo(id) {
            if (confirm('Are you sure you want to remove this video from your index?')) {
                videos = videos.filter(v => v.id !== id);
                localStorage.setItem('family_videos', JSON.stringify(videos));
                render();
            }
        }

        function filterVideos() { render(); }
        render();
    </script>
</body>
</html>
